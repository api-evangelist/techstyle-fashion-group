aid: techstyle-fashion-group
name: Techstyle Fashion Group
description: >-
  TechStyle Fashion Group is the El Segundo, California holding company founded in March 2010 by
  Don Ressler and Adam Goldenberg as JustFab Inc. and renamed TechStyle Fashion Group in August
  2016. It builds and operates direct-to-consumer membership fashion brands on a shared,
  proprietary commerce and personalization platform once marketed as TechStyle OS — Fabletics
  (with the Yitty shapewear line), Savage X Fenty, JustFab, ShoeDazzle and FabKids — selling
  apparel, footwear, activewear, intimates and accessories through a VIP membership subscription
  that gives members monthly credits, member pricing and a monthly skip window. The group reported
  more than five million paying VIP members and roughly $800 million in revenue as of 2019, and
  has since reorganized so that Fabletics, Savage X Fenty and the Global Fashion Brands unit
  (JustFab, ShoeDazzle, FabKids) run as standalone operating companies on the shared supply chain,
  fulfillment and technology stack. The TechStyle corporate identity itself has been retired: both
  techstyle.com and techstyleos.com now redirect to a Gandi domain-parking page at
  techstylefashiongroup.com that answers on plain HTTP only, so the group publishes no corporate
  site, no developer program, no API reference and no machine-readable contract of its own. The
  live API surface belongs to the operating brands, which are profiled separately in this network.
